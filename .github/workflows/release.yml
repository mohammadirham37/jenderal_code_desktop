# Release builds for macOS, Linux and Windows, and the GitHub Release with
# the updater feed (latest.json) installed apps update from. See
# docs/RELEASE.md.
#
# Runs on a pushed v* tag (scripts/release/tag.sh: an annotated tag whose
# message is the release notes), or by hand for an existing tag. The
# release is created only after every platform built, so it never shows up
# half-filled. Only the build and collect steps see the updater signing key
# (repository secret).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag, e.g. v0.1.1"
        required: true

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            bundles: app,dmg
            target: universal-apple-darwin
          - os: ubuntu-22.04
            bundles: deb,rpm,appimage
          - os: windows-latest
            bundles: nsis
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Check the tag matches the app version
        run: |
          v=$(node -p 'require("./apps/desktop/tauri.conf.json").version')
          [ "v$v" = "$TAG" ] || { echo "tag $TAG but app version $v"; exit 1; }

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev patchelf rpm file

      # Built here instead of beforeBuildCommand, whose `sh -c '…'` does not
      # survive cmd.exe on Windows.
      - name: Frontend
        run: npm --prefix frontend ci && npm --prefix frontend run build

      - name: Build and sign
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          set -o pipefail
          args=(--bundles "${{ matrix.bundles }}"
            --config '{"build":{"beforeBuildCommand":""},"bundle":{"createUpdaterArtifacts":true}}')
          [ -n "${{ matrix.target }}" ] && args+=(--target "${{ matrix.target }}")
          if ! npx --yes @tauri-apps/cli@2 build "${args[@]}"; then
            # The DMG step drives Finder over AppleScript, which can time
            # out on a headless runner; the .app is done by then and the
            # DMG is made with hdiutil in Collect.
            [ "$RUNNER_OS" = macOS ] && [ -d target/universal-apple-darwin/release/bundle/macos/JenderalCode.app ] || exit 1
            echo "::warning::tauri's DMG step failed; making the DMG with hdiutil"
          fi

      - name: Collect
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: |
          mkdir -p out
          V=${TAG#v}
          if [ "$RUNNER_OS" = macOS ]; then
            B=target/universal-apple-darwin/release/bundle
            DMG="out/JenderalCode_${V}_universal.dmg"
            if ls $B/dmg/*.dmg >/dev/null 2>&1; then
              cp $B/dmg/*.dmg "$DMG"
            else
              STAGE=$(mktemp -d)
              cp -R "$B/macos/JenderalCode.app" "$STAGE/"
              ln -s /Applications "$STAGE/Applications"
              hdiutil create -volname JenderalCode -srcfolder "$STAGE" -fs HFS+ -format UDZO -ov "$DMG"
            fi
            hdiutil verify "$DMG"
            lipo -archs "$B/macos/JenderalCode.app/Contents/MacOS/jenderalcode-desktop" | grep -q 'x86_64 arm64'
            cp "$B/macos/JenderalCode.app.tar.gz" "out/JenderalCode_${V}_universal.app.tar.gz"
            cp "$B/macos/JenderalCode.app.tar.gz.sig" "out/JenderalCode_${V}_universal.app.tar.gz.sig"
          elif [ "$RUNNER_OS" = Linux ]; then
            B=target/release/bundle
            cp $B/deb/*.deb $B/rpm/*.rpm $B/appimage/*.AppImage $B/appimage/*.AppImage.sig out/
            # Apps installed from .deb/.rpm update with a package of their
            # own kind (updater key linux-x86_64-deb / -rpm), so those are
            # signed too when the bundler did not.
            for f in $B/deb/*.deb $B/rpm/*.rpm; do
              if [ -f "$f.sig" ]; then cp "$f.sig" out/; else
                npx --yes @tauri-apps/cli@2 signer sign "$f" && cp "$f.sig" out/
              fi
            done
          else
            B=target/release/bundle
            cp $B/nsis/*-setup.exe $B/nsis/*-setup.exe.sig out/
          fi
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ runner.os }}
          path: out/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      # The workflow's own commit: the release scripts and the pubkey.
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: bundles-*
          merge-multiple: true
          path: dist

      - name: Release notes
        run: |
          # The annotated tag's message (checkout can drop the annotation,
          # so the tag is fetched again); for a release that already
          # exists, its notes.
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          if [ "$(git cat-file -t "$TAG")" = tag ]; then
            git tag -l --format='%(contents)' "$TAG" | sed '/^-----BEGIN PGP SIGNATURE-----/,$d' > notes.md
          elif gh release view "$TAG" >/dev/null 2>&1; then
            gh release view "$TAG" --json body -q .body > notes.md
          else
            echo "Release $TAG" > notes.md
          fi
          cat notes.md

      - name: Feed, checksums and release
        run: |
          V=${TAG#v}
          D="dist-release/$V"
          mkdir -p "$D"
          mv dist/* "$D/"
          node scripts/release/latest-json.mjs "$V" notes.md
          cat "$D/latest.json"
          (cd "$D" && sha256sum -- $(ls | grep -vE '\.sig$|^latest\.json$') > SHA256SUMS && cat SHA256SUMS)
          # .sig files are not uploaded: latest.json carries the signatures.
          files=$(find "$D" -type f ! -name '*.sig' | sort)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" --clobber $files
            gh release edit "$TAG" --notes-file notes.md --draft=false --latest
          else
            gh release create "$TAG" --title "$TAG" --notes-file notes.md --verify-tag --latest $files
          fi
